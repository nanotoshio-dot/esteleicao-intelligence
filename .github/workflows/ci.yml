name: Core Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall .

      - name: Check core dependencies
        run: |
          python -c "import pandas, pyarrow, requests, plotly, streamlit, py7zr; print('Dependencies OK')"

      - name: Check application helpers
        run: |
          python -c "import version, paths; print('Version:', version.__version__); print('Data dir:', paths.DATA_DIR)"
