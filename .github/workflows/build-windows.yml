name: Build Windows

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - "ESTELEICAO.spec"
      - "launcher.py"
      - "dashboard.py"
      - "data_service.py"
      - "analise.py"
      - "paths.py"
      - "version.py"
      - "VERSION"
      - "requirements.txt"
      - "requirements-build.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install build dependencies
        run: |
          pip install -r requirements-build.txt

      - name: Build ESTELEICAO
        run: |
          pyinstaller ESTELEICAO.spec --noconfirm --clean

      - name: Verify executable
        shell: powershell
        run: |
          if (-not (Test-Path "dist\ESTELEICAO\ESTELEICAO.exe")) {
              throw "ESTELEICAO.exe was not created."
          }

          Write-Host "ESTELEICAO.exe created successfully."

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ESTELEICAO-Windows
          path: dist/ESTELEICAO/
          if-no-files-found: error
          retention-days: 14
